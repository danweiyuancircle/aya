name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac-x64
            packArgs: ''
          - os: macos-latest
            platform: mac-arm64
            packArgs: ''
          - os: windows-latest
            platform: win
            packArgs: ''
          - os: ubuntu-latest
            platform: linux
            packArgs: '-- --linux'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y icnsutils graphicsmagick xz-utils

      - name: Install dependencies
        run: npm ci

      - name: Download ADB
        shell: bash
        run: npx zx script/adb.mjs

      - name: Download scrcpy server
        shell: bash
        run: npx zx script/scrcpy.mjs

      - name: Build Android helper server
        shell: bash
        run: npx zx script/server.mjs

      - name: Build
        run: npm run build

      - name: Package
        run: npm run pack ${{ matrix.packArgs }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/**/*.dmg
            release/**/*.exe
            release/**/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f

      - name: Extract changelog for this tag
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(awk -v tag="$TAG" '
            BEGIN { printing=0 }
            $0 ~ "^## " tag "( |$)" { printing=1; print; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="## ${TAG}"$'\n\n'"See CHANGELOG.md for details."
          fi
          PREV=$(git tag --sort=-version:refname | awk -v t="$TAG" '$0==t {getline; print; exit}')
          {
            echo "RELEASE_BODY<<EOF"
            printf '%s\n' "$NOTES"
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.changelog.outputs.RELEASE_BODY }}
          generate_release_notes: false
          draft: false
